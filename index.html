<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datafort Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Add PapaParse to read the CSV file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            cyan: '#00f0ff',
                            magenta: '#ff003c',
                            yellow: '#fcee0a',
                            dark: '#050505',
                            panel: '#121212',
                            border: '#333333'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #e5e7eb; overflow-x: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #00f0ff; }

        /* Cyberpunk Glitch & Glow Effects */
        .glow-cyan { text-shadow: 0 0 5px rgba(0,240,255,0.7); }
        .glow-magenta { text-shadow: 0 0 5px rgba(255,0,60,0.7); }
        .border-glow-cyan { box-shadow: 0 0 10px rgba(0,240,255,0.2); border-color: #00f0ff; }
        .border-glow-magenta { box-shadow: 0 0 15px rgba(255,0,60,0.4); border-color: #ff003c; }
        
        .scanline {
            position: fixed; left: 0; top: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; pointer-events: none; z-index: 50; opacity: 0.3;
        }

        /* Glitch animation for headers */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 1px) }
            40% { transform: translate(-1px, -1px) }
            60% { transform: translate(2px, 1px) }
            80% { transform: translate(1px, -1px) }
            100% { transform: translate(0) }
        }
        .glitch-hover:hover { animation: glitch 0.2s linear infinite; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="root" class="min-h-screen relative z-10 flex flex-col"></div>

    <script type="text/babel">
        const RAW_DATA = [
            { corp: "Adrek Robotics", desc: "Drone, robotics, and cyberware", tags: "#manufacturing #robotics #cyberware #drones", cyberware: "Adrek Robotics Burroughs (FBC)", notes: "Bitter rivals with Arasaka. Company folded after 4CW when most of their talent were wiped by the Soulkiller.", npcs: "", locations: "Chicago IL" },
            { corp: "Aerocab", desc: "Taxi service", tags: "#service #transportation", cyberware: "", notes: "Will not service the Hot Zone, the OCZ, or Rancho Coronado.", npcs: "", locations: "Night City-New Westbrook" },
            { corp: "Aesculapius Incorporated", desc: "Medical Equipment", tags: "#manufacturing #medicalequipment #consumermedical #healthcare", cyberware: "", notes: "Cybercast, Rapidetox, Blood Substitute, Limb Preservation/transport Unit, Archaesthetic", npcs: "", locations: "Athens, Greece" },
            { corp: "Americar", desc: "Automobiles", tags: "#manufacturing #automotive #vehicles", cyberware: "", notes: "(formerly) New American Motors / known for economy vehicles.", npcs: "", locations: "USA Midwest" },
            { corp: "Arasaka", desc: "Security, Banking, Manufacturing, Distribution, Weapons", tags: "#megacorp #manufacturing #personalsecurity #corporatesecurity #banking #finance #weapons #cybernetics #cyberware #consumergoods #legal #consulting #ACPA", cyberware: "Neo Standard ACPA, Neo Guardian ACPA, Shin DaiOni ACPA, Type-17k Guardian ACPA, Standard B ACPA, Standard C ACPA, DaiOni FBC, Cybereye, Cyberaudio Suite, Cyberarm, Cyberleg", notes: "\"Saka\" or アラサカ社 or 荒坂社. The largest, most influential megacorp in the world. Largest distributer of Japanese-made products worldwide.", npcs: "Saburo Arasaka, Kei Arasaka", locations: "Global, Night City, HQ in Tokyo, Japan" },
            { corp: "Asukaga & Finch", desc: "Investment and financial counseling", tags: "#banking #finance #consulting", cyberware: "", notes: "A&F / Developed and sponsors the Body Lotto", npcs: "", locations: "New York City" },
            { corp: "Beretta", desc: "Premium firearms", tags: "#manufacturing #weapons", cyberware: "", notes: "Fabbrica d'Armi Pietro Beretta, Beretta Euroarms, Royal Enfield Ordnance, Heckler & Koch and Rhinemetall.", npcs: "", locations: "Gardone Val Trompia, Italy" },
            { corp: "Biotechnica", desc: "CHOOH2, biotech, genetic engineering, pharma, microbiology", tags: "#megacorp #biotechnology #geneticengineering #biofuel #commercialagriculture #syntheticfood #pharmacology #healthcare", cyberware: "", notes: "", npcs: "", locations: "Night City-University District" },
            { corp: "Bodyweight Life Preservation Systems", desc: "Medical equipment, medicine, supplements, bioware, cyberware", tags: "#manufacturing #medicalequipment #healthcare #pharmacology #supplements #bioware #cyberware", cyberware: "Decentralized Heart, Variable-Chambered Heart Option, Vein Clips, Enhanced Lung Series, Pacesetter Sport Heart, Pacesetter 2000", notes: "\"Bodyweight\" / Very common. Multiple products in all price points and stores.", npcs: "", locations: "Night City" },
            { corp: "Braindance Inc", desc: "Braindance players and storage", tags: "#technology #computerhardware #braindancehardware", cyberware: "", notes: "Collaborates with Militech.", npcs: "", locations: "Night City" },
            { corp: "Brennan Cycles", desc: "Motorcycles", tags: "#manufacturing #motorcycles", cyberware: "", notes: "Names their motorcycles after Greek gods.", npcs: "", locations: "Night City" },
            { corp: "Buck-A-Slice", desc: "Restaurant, food trucks", tags: "#service #retailfood #fastfood", cyberware: "", notes: "Once popular, now compared to styrofoam for taste.", npcs: "", locations: "Night City" },
            { corp: "Budget Arms", desc: "Firearms", tags: "#manufacturing #weapons", cyberware: "", notes: "Budshitarms / Known for cheap, low-quality weapons.", npcs: "", locations: "Night City" },
            { corp: "Cactus Water", desc: "Bottled water", tags: "#manufacturing #consumerwater", cyberware: "", notes: "Rumor that their \"spring water\" is just filtered tap water.", npcs: "", locations: "Night City" },
            { corp: "Capsule Co", desc: "Cyberware", tags: "#manufacturing #cybernetics", cyberware: "Cyberpillow", notes: "Sometimes partners with KraftMatrix", npcs: "", locations: "" }
        ];

        const App = () => {
            const [corpData, setCorpData] = React.useState(RAW_DATA);
            const [gmMode, setGmMode] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('search');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [locationQuery, setLocationQuery] = React.useState('All');
            const [selectedImage, setSelectedImage] = React.useState(null);
            const fileInputRef = React.useRef(null);

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        const parsed = results.data.map(row => ({
                            corp: row['Corporation'] || '',
                            desc: row['Description'] || '',
                            tags: row['Tags'] || '',
                            logo: row['Logo'] || '',
                            cyberware: row['Cyberware'] || '',
                            notes: row['Nickname/Notes'] || '',
                            npcs: row['Known NPCs'] || '',
                            locations: row['Known Locations'] || ''
                        })).filter(c => c.corp); // Ensure we don't add blank rows
                        setCorpData(parsed);
                        alert(`Datashard Loaded: ${parsed.length} corporate profiles securely imported.`);
                    }
                });
            };

            // Derived Data Parsing (using corpData instead of RAW_DATA)
            const allLocations = ["All", ...new Set(corpData.map(c => c.locations.split(',')).flat().map(s => s.trim()).filter(s => s))].sort();
            
            const filteredCorps = corpData.filter(c => {
                const searchLower = searchQuery.toLowerCase();
                const matchesSearch = c.corp.toLowerCase().includes(searchLower) || 
                                      c.desc.toLowerCase().includes(searchLower) || 
                                      c.tags.toLowerCase().includes(searchLower);
                return matchesSearch;
            });

            const cyberwareList = [];
            corpData.forEach(c => {
                if(c.cyberware) {
                    const items = c.cyberware.split(',').map(i => i.trim());
                    items.forEach(i => cyberwareList.push({ item: i, corp: c.corp }));
                }
            });

            const locationCorps = corpData.filter(c => locationQuery === 'All' || c.locations.includes(locationQuery));
            
            const npcList = [];
            corpData.forEach(c => {
                if(c.npcs) {
                    const chars = c.npcs.split(',').map(n => n.trim());
                    chars.forEach(char => npcList.push({ name: char, corp: c.corp }));
                }
            });

            return (
                <div className={`flex-1 flex flex-col transition-colors duration-300 ${gmMode ? 'border-t-4 border-cyber-magenta' : 'border-t-4 border-cyber-cyan'}`}>
                    
                    {/* Header Bar */}
                    <header className="bg-cyber-panel border-b border-cyber-border p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <i className={`fas fa-server text-3xl ${gmMode ? 'text-cyber-magenta glow-magenta' : 'text-cyber-cyan glow-cyan'}`}></i>
                            <div>
                                <h1 className="font-display text-2xl md:text-3xl font-bold uppercase tracking-wider glitch-hover">
                                    DATAFORT NAVIGATOR
                                </h1>
                                <p className="text-xs text-gray-400 font-mono">Records: {corpData.length} active nodes</p>
                            </div>
                        </div>

                        <div className="flex flex-col md:flex-row items-center gap-4">
                            {/* File Upload Button */}
                            <input 
                                type="file" 
                                accept=".csv" 
                                className="hidden" 
                                ref={fileInputRef}
                                onChange={handleFileUpload}
                            />
                            <button 
                                onClick={() => fileInputRef.current.click()}
                                className="bg-gray-800 hover:bg-gray-700 text-xs text-white font-mono py-2 px-4 rounded border border-gray-600 transition-colors flex items-center"
                            >
                                <i className="fas fa-upload mr-2"></i> LOAD DATASHARD (.CSV)
                            </button>

                            {/* GM Toggle Switch */}
                            <div className="flex items-center gap-3 bg-black p-2 rounded-lg border border-gray-800">
                                    <i className="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500"></i>
                                    <input 
                                        type="text" 
                                        placeholder="Query Corporate Database (Name, Tag, Keyword)..." 
                                        className={`w-full bg-cyber-panel text-white p-4 pl-12 rounded-lg outline-none focus:ring-2 transition-all font-mono text-sm md:text-base ${gmMode ? 'focus:ring-cyber-magenta focus:border-cyber-magenta border border-gray-800' : 'focus:ring-cyber-cyan focus:border-cyber-cyan border border-gray-800'}`}
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredCorps.length === 0 ? (
                                        <div className="col-span-full text-center py-10 text-gray-500 font-mono">No database records found.</div>
                                    ) : (
                                        filteredCorps.map((corp, idx) => (
                                            <div key={idx} className={`bg-cyber-panel rounded-lg p-5 border border-gray-800 flex flex-col transition-all hover:-translate-y-1 ${gmMode ? 'hover:border-glow-magenta' : 'hover:border-glow-cyan'}`}>
                                                <div className="flex justify-between items-start mb-3">
                                                    <div className="flex items-center gap-3">
                                                        {corp.logo && (
                                                            <img 
                                                                src={corp.logo} 
                                                                alt={`${corp.corp} logo`} 
                                                                className="w-12 h-12 object-contain bg-black rounded border border-gray-700 cursor-pointer hover:opacity-80 transition-opacity"
                                                                onClick={() => setSelectedImage(corp.logo)}
                                                                title="Click to enlarge"
                                                            />
                                                        )}
                                                        <h2 className={`font-display text-2xl font-bold uppercase ${gmMode ? 'text-white' : 'text-cyber-cyan'}`}>{corp.corp}</h2>
                                                    </div>
                                                    {corp.tags.includes('#megacorp') && <span className="bg-yellow-500 text-black text-xs font-bold px-2 py-1 rounded mt-1">MEGACORP</span>}
                                                </div>
                                                <p className="text-sm text-gray-300 mb-4 flex-1">{corp.desc}</p>
                                                
                                                <div className="flex flex-wrap gap-1 mb-4">
                                                    {corp.tags.split(' ').map((tag, i) => (
                                                        <span key={i} className="text-[10px] font-mono text-gray-400 bg-gray-900 px-2 py-1 rounded">{tag}</span>
                                                    ))}
                                                </div>

                                                {/* GM ONLY DATA */}
                                                {gmMode && (corp.notes || corp.npcs) && (
                                                    <div className="mt-4 pt-4 border-t border-dashed border-cyber-magenta border-opacity-50">
                                                        <h3 className="text-cyber-magenta font-display text-sm uppercase mb-2 flex items-center"><i className="fas fa-lock mr-2"></i> Classified GM Intel</h3>
                                                        {corp.notes && <p className="text-xs font-mono text-red-200 mb-2 p-2 bg-red-950 bg-opacity-30 rounded border border-red-900">{corp.notes}</p>}
                                                        {corp.npcs && <p className="text-xs font-mono text-gray-400"><span className="text-cyber-magenta">Known VIPs:</span> {corp.npcs}</p>}
                                                    </div>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'cyberware' && (
                            <div className="max-w-4xl mx-auto space-y-4">
                                <h2 className="font-display text-2xl mb-6 text-gray-300 border-b border-gray-800 pb-2">
                                    <i className="fas fa-microchip mr-2"></i> Cataloged Cyberware & Hardware
                                </h2>
                                <div className="bg-cyber-panel rounded-lg border border-gray-800 overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-black text-gray-400 font-display uppercase text-sm border-b border-gray-800">
                                                <th className="p-4 w-2/3">Hardware / Upgrade Name</th>
                                                <th className="p-4 w-1/3">Manufacturer</th>
                                            </tr>
                                        </thead>
                                        <tbody className="font-mono text-sm">
                                            {cyberwareList.map((item, idx) => (
                                                <tr key={idx} className="border-b border-gray-800 hover:bg-gray-900 transition-colors">
                                                    <td className="p-4 text-white">{item.item}</td>
                                                    <td className={`p-4 font-bold ${gmMode ? 'text-cyber-magenta' : 'text-cyber-cyan'}`}>{item.corp}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'locations' && (
                            <div className="max-w-5xl mx-auto space-y-6">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                                    <h2 className="font-display text-2xl text-gray-300">
                                        <i className="fas fa-globe mr-2"></i> Corporate Territory Map
                                    </h2>
                                    <select 
                                        className="bg-black border border-gray-700 text-white p-3 rounded outline-none font-mono text-sm focus:border-cyber-cyan w-full md:w-auto"
                                        value={locationQuery}
                                        onChange={(e) => setLocationQuery(e.target.value)}
                                    >
                                        {allLocations.map((loc, i) => (
                                            <option key={i} value={loc}>{loc === 'All' ? 'GLOBAL OVERVIEW (ALL)' : loc.toUpperCase()}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {locationCorps.map((corp, idx) => (
                                        <div key={idx} className="bg-cyber-panel p-4 rounded flex justify-between items-center border border-gray-800">
                                            <div>
                                                <h3 className={`font-display font-bold text-xl ${gmMode ? 'text-cyber-magenta' : 'text-cyber-cyan'}`}>{corp.corp}</h3>
                                                <p className="text-xs text-gray-400 font-mono mt-1">{corp.desc}</p>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-xs bg-gray-800 px-2 py-1 rounded text-gray-300 font-mono">
                                                    <i className="fas fa-map-pin mr-1"></i> {corp.locations || "Unknown"}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'npcs' && (
                            <div className="max-w-4xl mx-auto space-y-4">
                                {gmMode ? (
                                    <>
                                        <h2 className="font-display text-2xl mb-6 text-cyber-magenta border-b border-cyber-magenta border-opacity-30 pb-2">
                                            <i className="fas fa-user-secret mr-2"></i> Known High-Profile Targets (VIPs)
                                        </h2>
                                        <div className="grid gap-4">
                                            {npcList.map((npc, idx) => (
                                                <div key={idx} className="bg-black border-l-4 border-cyber-magenta p-4 flex items-center justify-between">
                                                    <div className="flex items-center gap-4">
                                                        <div className="w-10 h-10 bg-gray-900 rounded-full flex items-center justify-center border border-gray-700">
                                                            <i className="fas fa-user text-gray-500"></i>
                                                        </div>
                                                        <div>
                                                            <h4 className="text-white font-bold font-display text-lg">{npc.name}</h4>
                                                            <p className="text-xs text-gray-500 font-mono">Affiliation: <span className="text-gray-300">{npc.corp}</span></p>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => {
                                                            setSearchQuery(npc.corp);
                                                            setActiveTab('search');
                                                        }}
                                                        className="text-xs font-mono text-cyber-magenta hover:text-white border border-cyber-magenta px-3 py-1 rounded transition-colors"
                                                    >
                                                        VIEW CORP
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                ) : (
                                    <div className="text-center py-20">
                                        <i className="fas fa-lock text-6xl text-gray-700 mb-4"></i>
                                        <h2 className="font-display text-2xl text-gray-500">ACCESS DENIED</h2>
                                        <p className="font-mono text-sm text-gray-600 mt-2">Personnel files require Game Master override authorization.</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {}
                        {selectedImage && (
                            <div 
                                className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90 p-4 cursor-pointer transition-opacity"
                                onClick={() => setSelectedImage(null)}
                            >
                                <div className="relative max-w-4xl max-h-full">
                                    <button 
                                        className="absolute -top-10 right-0 text-gray-400 hover:text-white text-xl font-mono transition-colors"
                                        onClick={() => setSelectedImage(null)}
                                    >
                                        <i className="fas fa-times mr-2"></i>CLOSE
                                    </button>
                                    <img 
                                        src={selectedImage} 
                                        alt="Full size corporate logo" 
                                        className="max-w-full max-h-[80vh] object-contain border border-gray-700 rounded-lg shadow-2xl bg-black"
                                    />
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
